name: Aggiorna e pubblica

on:
  schedule:
    - cron: "30 22 * * 1-5"   # lun-ven, dopo la chiusura di Wall Street (ora UTC)
  workflow_dispatch:           # per lanciarlo a mano
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salva i dati nel repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/data.json
          git diff --cached --quiet || (git commit -m "Aggiornamento dati" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
